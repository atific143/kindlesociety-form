<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KindleSociety - Team & Volunteer Registration Form</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Hind Siliguri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#070f14',
              card: '#0d1b2a',
              green: '#46B261',
              greenHover: '#399450',
              input: '#12263f',
              border: '#1e3a5f',
              text: '#FFFFFF'
            }
          },
          fontFamily: {
            sans: ['Hind Siliguri', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at center, #0f2236 0%, #070f14 100%);
      color: #FFFFFF;
      font-family: 'Hind Siliguri', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Highly Visible & Smooth Animated Gradient Title Effect */
    @keyframes superGlow {
      0% {
        background-position: 0% 50%;
        text-shadow: 0 0 10px rgba(70, 178, 97, 0.4);
      }
      50% {
        background-position: 100% 50%;
        text-shadow: 0 0 30px rgba(70, 178, 97, 0.9), 0 0 10px rgba(255, 255, 255, 0.6);
      }
      100% {
        background-position: 0% 50%;
        text-shadow: 0 0 10px rgba(70, 178, 97, 0.4);
      }
    }

    .animated-title {
      background: linear-gradient(270deg, #FFFFFF, #46B261, #a7f3d0, #FFFFFF);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: superGlow 4s ease infinite;
    }

    /* Smooth Expandable Sections with Arrow Animation */
    .expandable-section {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-15px);
    }

    .expandable-section.active {
      max-height: 1500px;
      opacity: 1;
      transform: translateY(0);
      margin-top: 20px;
    }

    /* Hover/Touch Description Effect for Role Cards */
    .role-desc {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transition: all 0.4s ease-in-out;
    }
    
    .role-card:hover .role-desc,
    input[type="radio"]:checked ~ .role-desc {
      max-height: 120px;
      opacity: 1;
      margin-top: 6px;
    }

    /* Interactive Hover Effects */
    .interactive-card {
      transition: all 0.3s ease;
    }
    .interactive-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -5px rgba(70, 178, 97, 0.3);
      border-color: #46B261;
    }

    /* Custom White Branding Badge Glow Effect */
    .branding-badge {
      background-color: #FFFFFF;
      border: 2px solid #46B261;
      transition: all 0.4s ease;
    }
    .branding-badge:hover {
      box-shadow: 0 0 20px rgba(70, 178, 97, 0.6);
      transform: translateY(-3px);
    }

    input[type="radio"]:checked + .role-card {
      border-color: #46B261;
      background-color: rgba(70, 178, 97, 0.2);
      box-shadow: 0 0 15px rgba(70, 178, 97, 0.4);
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070f14;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e3a5f;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #46B261;
    }
  </style>
</head>
<body class="py-6 px-3 sm:py-10 sm:px-6 lg:px-8 flex flex-col items-center justify-center relative min-h-screen">

  <div class="w-full max-w-3xl bg-brand-card rounded-2xl sm:rounded-3xl shadow-2xl border border-brand-border/80 overflow-hidden backdrop-blur-md relative mb-20">
    
    <!-- 1. Header Banner with Animated Title -->
    <div class="relative p-6 sm:p-10 text-center overflow-hidden border-b-4 border-[#46B261]" style="background: linear-gradient(135deg, #070f14 0%, #0d1b2a 50%, #163824 100%);">
      <div class="absolute -top-16 -right-16 w-32 sm:w-48 h-32 sm:h-48 bg-[#46B261]/20 rounded-full blur-3xl pointer-events-none"></div>
      <div class="absolute -bottom-16 -left-16 w-32 sm:w-48 h-32 sm:h-48 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>

      <h1 class="text-2xl sm:text-5xl font-extrabold tracking-wide mb-2 animated-title">
        KindleSociety
      </h1>
      <p class="text-xs sm:text-base font-medium tracking-wide max-w-xl mx-auto text-[#46B261]">
        Empowering Youth, Building Community
      </p>
      <div class="mt-3 inline-block px-3.5 py-1 rounded-full text-xs sm:text-sm font-semibold tracking-wide text-[#FFFFFF] bg-[#070f14]/90 border border-[#46B261]/50 shadow-inner">
        Team & Volunteer Registration Form
      </div>
    </div>

    <!-- Form Container (Formspree Integrated) -->
    <form id="registrationForm" class="p-4 sm:p-10 space-y-6 sm:space-y-8" action="https://formspree.io/f/xvkzyowj" method="POST">
      
      <!-- Notice 1 -->
      <div class="bg-[#070f14]/80 border-l-4 border-[#46B261] p-3.5 sm:p-4 rounded-r-xl text-xs sm:text-sm text-gray-300 flex items-start space-x-3 shadow-md">
        <div class="flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full flex items-center justify-center text-white font-bold text-xs mt-0.5 bg-[#46B261]">
          <i class="fa-solid fa-info text-[10px] sm:text-xs"></i>
        </div>
        <span>Please fill out the form with correct information. Fields marked with green star (<span class="text-[#46B261] font-bold">*</span>) are mandatory.</span>
      </div>

      <!-- Notice 2 -->
      <div class="bg-[#070f14]/80 border-l-4 border-[#46B261] p-3.5 sm:p-4 rounded-r-xl text-xs sm:text-sm text-gray-300 flex items-start space-x-3 shadow-md">
        <div class="flex-shrink-0 w-5 h-5 sm:w-6 sm:h-6 rounded-full flex items-center justify-center text-white font-bold text-xs mt-0.5 bg-[#46B261]">
          <i class="fa-solid fa-hand-pointer text-[10px] sm:text-xs"></i>
